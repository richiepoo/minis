<title>Mill Valley Police Department — Warrant Builder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%2315193a' width='16' height='16'/%3E%3C/svg%3E">
<style>
@font-face { font-family: "Newsreader"; src: url("vendor/newsreader-400.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "Newsreader"; src: url("vendor/newsreader-600.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: swap; }
@font-face { font-family: "Public Sans"; src: url("vendor/publicsans-400.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "Public Sans"; src: url("vendor/publicsans-600.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: swap; }
:root {
  --bg: #faf9f5;
  --panel: #ffffff;
  --ink: #15193a;
  --navy: #1b2255;
  --brass: #8f7340;
  --line: #e4dfd2;
  --muted: #5c6178;
  --warn: #7a2e2e;
  --template: #f3ead2;
  --officer: #dcead9;
  --serif: "Newsreader", "Iowan Old Style", Palatino, Georgia, serif;
  --sans: "Public Sans", "Segoe UI", sans-serif;
}
body.dark {
  --bg: #12141c;
  --panel: #1c1e2a;
  --ink: #f3efe4;
  --navy: #d5dcff;
  --line: #34384a;
  --muted: #b7b3a8;
  --template: #3d3624;
  --officer: #243528;
}
* { box-sizing: border-box; }
html, body { margin: 0; max-width: 100%; overflow-x: hidden; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.45; }
button, input, select, textarea { font-family: inherit; font-size: 16px; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
header.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
  padding: 12px 16px 10px; background: #15193a; color: #faf9f5;
}
.mark { width: 48px; height: 58px; flex: 0 0 auto; }
.brand { flex: 1 1 200px; min-width: 0; }
.brand h1 { font-family: var(--serif); font-weight: 600; font-size: 22px; line-height: 1.15; margin: 0; }
.brand p { margin: 2px 0 0; font-size: 13px; letter-spacing: .01em; color: #e6e1d4; }
.head-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.head-actions button, .texty {
  background: transparent; color: #faf9f5; border: 1px solid #8f7340; border-radius: 4px; padding: 6px 10px;
}
.privacy { margin: 0; padding: 8px 16px; font-size: 13px; color: var(--muted); }
.rule { height: 3px; background: var(--brass); }
main { padding: 16px 16px 108px; }
.type-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.type-tile {
  display: flex; flex-direction: column; justify-content: space-between;
  min-height: 104px; height: 100%; text-align: left;
  background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-top: 3px solid #1b2255;
  padding: 12px; font-family: var(--serif); font-size: 18px; line-height: 1.25;
}
.type-tile span { display: block; margin-top: 6px; font-family: var(--sans); font-size: 12px; color: var(--muted); font-weight: 400; }
.ai-line {
  display: inline; margin: 14px 0 0; padding: 0; border: 0; background: none; box-shadow: none;
  color: var(--ink); text-decoration: none; font-size: 15px; cursor: pointer;
}
.ai-explain { max-width: 68ch; color: var(--muted); font-size: 14px; margin: 8px 0 0; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--line); padding: 12px; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; padding: 0; list-style: none; }
.chips button { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 99px; padding: 4px 10px; }
.chips button.on { background: #1b2255; color: #faf9f5; border-color: #1b2255; }
body.dark .chips button.on { background: #d5dcff; color: #15193a; }
.field { margin: 0 0 12px; min-width: 0; }
.field label, .check { display: block; margin-bottom: 4px; }
input[type="text"], input[type="date"], input[type="time"], select, textarea {
  width: 100%; max-width: 100%; background: var(--bg); color: var(--ink);
  border: 1px solid var(--line); padding: 8px; border-radius: 2px;
}
textarea { min-height: 120px; resize: vertical; }
.check { display: flex; gap: 8px; align-items: flex-start; }
.check input { margin-top: 3px; }
details.how { margin: 0 0 12px; }
details.how summary { cursor: pointer; color: var(--navy); }
details.how p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
.warn { border-left: 3px solid var(--brass); padding: 8px 10px; margin: 0 0 12px; background: var(--bg); }
.warn strong { font-family: var(--serif); }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.row-actions button, .export-bar button, .primary {
  background: #1b2255; color: #faf9f5; border: 0; border-radius: 2px; padding: 8px 12px;
}
.ghost { background: transparent !important; color: var(--ink) !important; border: 1px solid var(--line) !important; }
.doc-chrome { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.model-flag { margin: 0; font-size: 13px; color: var(--warn); flex: 1 1 180px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
.tabs button { border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 4px 8px; }
.tabs button.on { border-color: var(--brass); box-shadow: inset 0 -2px 0 var(--brass); }
.paper {
  background: var(--panel); color: var(--ink); border: 1px solid var(--line);
  padding: 22px 18px; font-family: var(--serif); font-size: 17px; line-height: 1.45;
  overflow-wrap: anywhere;
}
.paper h2 { font-size: 18px; text-align: center; font-weight: 600; margin: 14px 0 8px; }
.paper p { margin: 0 0 10px; }
.paper .center { text-align: center; }
.paper .court { text-align: center; letter-spacing: .04em; font-weight: 600; margin: 0; }
.paper .hair { border: 0; border-top: 1px solid var(--brass); margin: 8px 0 12px; }
.paper img.exhibit { display: block; max-width: 100%; height: auto; margin: 8px auto; }
.legend { font-family: var(--sans); font-size: 13px; color: var(--muted); margin: 0 0 8px; }
body.sources-on .run.template { background: var(--template); }
body.sources-on .run.officer { background: var(--officer); }
body.sources-on .run.blank { border-bottom: 1px solid var(--brass); }
.check-group { margin: 14px 0 6px; font-family: var(--serif); font-size: 18px; }
.check-item { list-style: none; margin: 0 0 10px; padding: 8px; border: 1px solid transparent; }
.check-item.outlined { outline: 2px solid var(--brass); outline-offset: 2px; }
.checks { margin: 0; padding: 0; }
.due, .detail { margin: 4px 0 0 26px; color: var(--muted); font-size: 14px; }
.mini { width: auto; max-width: 100%; margin: 6px 0 0 26px; }
.miss li { margin-bottom: 4px; }
.bottom-strip {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  background: #15193a; color: #faf9f5; padding: 10px 14px;
}
#stripText { flex: 1 1 200px; margin: 0; min-width: 0; }
.bottom-strip button { background: transparent; color: #faf9f5; border: 1px solid #8f7340; padding: 6px 10px; }
#overlay[hidden] { display: none; }
#overlay { position: fixed; inset: 0; background: rgba(21,25,58,.5); z-index: 20; overflow: auto; padding: 16px; }
.sheet { background: var(--panel); color: var(--ink); max-width: 740px; margin: 12px auto 40px; padding: 16px; }
.sheet h2, .sheet h3 { font-family: var(--serif); }
.sheet table { width: 100%; border-collapse: collapse; font-size: 14px; }
.sheet td, .sheet th { border-bottom: 1px solid var(--line); text-align: left; padding: 4px; vertical-align: top; }
.doc-switch { display: none; }
@media (max-width: 860px) {
  .type-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .layout { grid-template-columns: minmax(0, 1fr); }
  .doc-switch { display: inline-block; }
  body:not(.show-doc) .pane-doc { display: none; }
  body.show-doc .pane-form { display: none; }
}
@media (max-width: 420px) {
  .type-grid { grid-template-columns: minmax(0, 1fr); }
  .type-tile { min-height: 104px; }
}
@media print {
  .top, .privacy, .rule, .pane-form, .doc-chrome, .bottom-strip, #overlay { display: none !important; }
  main { padding: 0; }
  .pane-doc { display: block !important; }
  .paper { border: 0; color: black; background: white; }
}
</style>
</head>

<script>
"use strict";
/* Warrant Builder mvpd-wb-1. Fixed clauses plus the officer's own words.
   No model calls, no fetch, no Math.random, no Date.now.
   JSZip 3.10.1 is vendored from cdnjs so export does not call the network:
   https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js
   Marin motion docx was not attached. PING_TEMPLATE_B64 stays empty. */
const TEMPLATE_VERSION = "mvpd-wb-1";
const MAG_ROOM = "da_magroom@marincounty.gov";
let pingTemplateB64 = "";
const HOLIDAYS = {
  "2026-01-01": "New Year's Day",
  "2026-01-19": "Dr. Martin Luther King, Jr. Day",
  "2026-02-12": "Lincoln's Birthday",
  "2026-02-16": "Presidents Day",
  "2026-03-31": "Farmworkers Day",
  "2026-05-25": "Memorial Day",
  "2026-06-19": "Juneteenth",
  "2026-07-03": "Independence Day (observed)",
  "2026-09-07": "Labor Day",
  "2026-09-25": "Native American Day",
  "2026-11-11": "Veterans Day",
  "2026-11-26": "Thanksgiving",
  "2026-11-27": "Day after Thanksgiving",
  "2026-12-25": "Christmas Day",
  "2027-01-01": "New Year's Day",
  "2027-01-18": "Martin Luther King, Jr. Day",
  "2027-02-12": "Lincoln's Birthday",
  "2027-02-15": "Washington's Birthday",
  "2027-04-09": "Farmworkers Day",
  "2027-05-31": "Memorial Day",
  "2027-06-18": "Juneteenth (observed)",
  "2027-07-05": "Independence Day (observed)",
  "2027-09-06": "Labor Day",
  "2027-09-24": "Native American Day",
  "2027-11-11": "Veterans Day",
  "2027-11-25": "Thanksgiving",
  "2027-11-26": "Day after Thanksgiving",
  "2027-12-24": "Christmas Day (observed)"
};
const WEEKDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const CRIMES = ["Property","DVSA","DUI","Persons","Narcotics","Fraud","Missing person","Other"];
const DELAY_REASONS = [
  "Danger to the life or physical safety of an individual",
  "Flight from prosecution",
  "Destruction of or tampering with evidence",
  "Intimidation of potential witnesses",
  "Serious jeopardy to an investigation or undue delay of a trial"
];
const PROFILE_KEYS = ["officerName","badge","years","assignment","training"];
const GAP_LABELS = {
  nondisclosure: "CalECPA non-disclosure",
  delay: "delayed notice and extension",
  custodian: "custodian declaration",
  fiveday: "5-day production",
  unrelated: "sealing of unrelated data",
  sealorder: "sealing order",
  hobbs: "Hobbs attachment",
  notices: "notices"
};

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
  });
}
function parseISO(iso) {
  const p = String(iso || "").split("-");
  if (p.length !== 3) return null;
  const y = Number(p[0]), m = Number(p[1]), d = Number(p[2]);
  if (!y || !m || !d) return null;
  return new Date(Date.UTC(y, m - 1, d));
}
function fmt(dt) {
  const y = dt.getUTCFullYear();
  const m = String(dt.getUTCMonth() + 1).padStart(2, "0");
  const d = String(dt.getUTCDate()).padStart(2, "0");
  return y + "-" + m + "-" + d;
}
function addCal(iso, n) {
  const dt = parseISO(iso);
  if (!dt) return "";
  dt.setUTCDate(dt.getUTCDate() + n);
  return fmt(dt);
}
function isWeekend(iso) {
  const dt = parseISO(iso);
  if (!dt) return false;
  const day = dt.getUTCDay();
  return day === 0 || day === 6;
}
function isHoliday(iso) { return !!HOLIDAYS[iso]; }
function isCourtDay(iso) { return !!parseISO(iso) && !isWeekend(iso) && !isHoliday(iso); }
function longDate(iso) {
  const dt = parseISO(iso);
  if (!dt) return "";
  return WEEKDAYS[dt.getUTCDay()] + ", " + MONTHS[dt.getUTCMonth()] + " " + dt.getUTCDate() + ", " + dt.getUTCFullYear();
}
function outsideTable(iso) {
  return !!iso && (iso < "2026-01-01" || iso > "2027-12-31");
}
function courtDaysAfter(iso, n) {
  if (!parseISO(iso)) return "";
  let cur = iso;
  let left = n;
  let guard = 0;
  while (left > 0 && guard < 400) {
    cur = addCal(cur, 1);
    if (isCourtDay(cur)) left -= 1;
    guard += 1;
  }
  return cur;
}
function businessDaysAfter(iso, n) {
  return courtDaysAfter(iso, n);
}
function executionDay(issueIso) { return addCal(issueIso, 10); }
function lastCourtOnOrBefore(iso) {
  let cur = iso;
  let guard = 0;
  while (cur && (!isCourtDay(cur)) && guard < 20) {
    cur = addCal(cur, -1);
    guard += 1;
  }
  return cur;
}
function returnBy(issueIso) {
  const day10 = executionDay(issueIso);
  if (!day10) return "";
  if (isWeekend(day10) || isHoliday(day10)) return lastCourtOnOrBefore(addCal(day10, -1));
  return day10;
}
function earlierDate(a, b) {
  if (!a) return b || "";
  if (!b) return a;
  return a < b ? a : b;
}
function showDate(iso) {
  if (!iso) return "Enter the date this count starts from.";
  let text = longDate(iso);
  if (outsideTable(iso)) text += " — past the holiday table (verified through December 31, 2027). Check the court calendar.";
  return text;
}

const state = {
  type: null,
  step: 0,
  answers: {},
  post: {},
  checks: {},
  exhibits: [],
  docTab: null,
  sources: false,
  showDoc: false
};
const stash = {};

function val(key) { return String(state.answers[key] == null ? "" : state.answers[key]).trim(); }
function post(key) { return String(state.post[key] == null ? "" : state.post[key]).trim(); }
function on(key) { return state.answers[key] === "yes"; }

function stepsFor(type) {
  if (type === "ping") {
    return [
      { id: "you", label: "You" },
      { id: "emergency", label: "Emergency?" },
      { id: "request", label: "Request" },
      { id: "results", label: "Results" },
      { id: "facts", label: "Facts" },
      { id: "conditions", label: "Special conditions" },
      { id: "review", label: "Review" },
      { id: "after", label: "After filing" }
    ];
  }
  return [
    { id: "you", label: "You" },
    { id: "target", label: "Target" },
    { id: "seeking", label: "Looking for" },
    { id: "facts", label: "Facts" },
    { id: "conditions", label: "Special conditions" },
    { id: "review", label: "Review" },
    { id: "after", label: "After signing" }
  ];
}
function nightFormOnly() {
  return state.type === "blood" && on("nightForm") && !on("major");
}
function stopped911() {
  return state.type === "ping" && state.answers.same911 === "yes";
}
function buildingPacket() {
  return !!state.type && !stopped911() && !nightFormOnly();
}
function phonesInPlace() { return state.type === "place" && on("phones"); }
function bloodPhone() { return state.type === "blood" && on("bloodPhone"); }
function electronicMatter() {
  return state.type === "records" || state.type === "device" || state.type === "tracker" || phonesInPlace() || bloodPhone();
}
function needsNotice() {
  if (stopped911() || nightFormOnly() || state.type === "ramey") return false;
  if (state.type === "ping" || state.type === "pen" || state.type === "records" || state.type === "device" || state.type === "tracker") return true;
  if (phonesInPlace() || bloodPhone() || on("delay")) return true;
  return false;
}
function geofenceHit() {
  const blob = [val("items"), val("facts"), val("recOther"), val("phoneData"), val("seekingNote")].join(" ").toLowerCase();
  return /geofence|location history/.test(blob);
}

function crimeOptions() {
  return [{ value: "", label: "Select" }].concat(CRIMES.map(function (c) { return { value: c, label: c }; }));
}
function fieldShow(f) { return !f.show || f.show(); }
function fieldReq(f) {
  if (!fieldShow(f)) return false;
  if (typeof f.required === "function") return !!f.required();
  return !!f.required;
}
function fieldsFor(stepId) {
  const t = state.type;
  if (stepId === "you") {
    const hideDa = t === "ping" || nightFormOnly();
    return [
      { key: "officerName", label: "Your name", type: "text", required: true },
      { key: "badge", label: "Badge", type: "text", required: true },
      { key: "years", label: "Years on the job", type: "text" },
      { key: "assignment", label: "Assignment", type: "text" },
      { key: "training", label: "Warrant training", type: "text" },
      { key: "caseNumber", label: "Case number", type: "text", required: true },
      { key: "crimeType", label: "Crime type", type: "select", options: crimeOptions(), required: t !== "ping", show: function () { return t !== "ping"; } },
      { key: "daName", label: "Deputy DA name", type: "text", show: function () { return !hideDa; } },
      { key: "daEmail", label: "Deputy DA email", type: "text", show: function () { return !hideDa; } },
      { key: "issueDate", label: "Date the judge will sign", type: "date", required: function () { return t !== "ping" && !nightFormOnly(); }, show: function () { return t !== "ping"; } }
    ];
  }
  if (stepId === "emergency") {
    return [
      { key: "danger", label: "Danger of death or serious physical injury", type: "textarea", required: function () { return state.answers.same911 !== "yes"; } },
      { key: "whyNoWarrant", label: "Why a warrant could not be obtained in time", type: "textarea", required: function () { return state.answers.same911 !== "yes"; } },
      { key: "same911", label: "Was this a 911 call from this same phone?", type: "radio", rerender: true, required: true, options: [
        { value: "no", label: "No" },
        { value: "yes", label: "Yes — from this same phone" }
      ] }
    ];
  }
  if (stepId === "request") {
    if (stopped911()) return [];
    return [
      { key: "phone", label: "Phone number", type: "text", required: true },
      { key: "carrier", label: "Carrier", type: "text", required: true },
      { key: "approveSgt", label: "Sergeant who approved the ping", type: "text", required: true },
      { key: "requestDate", label: "Date of the request", type: "date", required: true },
      { key: "requestTime", label: "Time of the request", type: "time", required: true },
      { key: "requestWhat", label: "What you asked the carrier for", type: "text", required: true }
    ];
  }
  if (stepId === "results") {
    if (stopped911()) return [];
    return [
      { key: "firstDate", label: "Date the first result was obtained", type: "date", required: true },
      { key: "firstTime", label: "Time the first result was obtained", type: "time", required: true },
      { key: "firstResult", label: "What the first result said", type: "textarea", required: true },
      { key: "laterResults", label: "Later results, if any", type: "textarea" }
    ];
  }
  if (stepId === "target") return targetFields();
  if (stepId === "seeking") return seekingFields();
  if (stepId === "facts") {
    if (!buildingPacket()) return [];
    return [{ key: "facts", label: "Facts, in your own words", type: "textarea", required: true }];
  }
  if (stepId === "conditions") return conditionFields();
  return [];
}
function targetFields() {
  const t = state.type;
  if (t === "place") {
    return [
      { key: "placeKind", label: "What is to be searched?", type: "radio", rerender: true, required: true, options: [
        { value: "home", label: "Home" },
        { value: "building", label: "Building" },
        { value: "car", label: "Car" },

function applyField(t) {
  if (t.dataset.a) {
    if (t.type === "checkbox") state.answers[t.dataset.a] = t.checked ? "yes" : "no";
    else if (t.type === "radio") { if (t.checked) state.answers[t.dataset.a] = t.value; }
    else state.answers[t.dataset.a] = t.value;
  }
  if (t.dataset.post) state.post[t.dataset.post] = t.value;
  if (t.dataset.check) state.checks[t.dataset.check] = t.checked;
  if (t.dataset.ex != null) {
    const ex = state.exhibits[Number(t.dataset.ex)];
    if (ex) ex.caption = t.value;
  }
}
function onFormEvent(e) {
  const t = e.target;
  if (t.id === "sources") {
    state.sources = t.checked;
    document.body.classList.toggle("sources-on", state.sources);
    renderDoc();
    return;
  }
  if (t.dataset.step != null) {
    state.step = Number(t.dataset.step);
    render();
    return;
  }
  if (t.dataset.doc) {
    state.docTab = t.dataset.doc;
    renderDoc();
    return;
  }
  if (t.dataset.open) {
    state.docTab = t.dataset.open;
    state.showDoc = true;
    document.body.classList.add("show-doc");
    const btn = document.getElementById("btnPane");
    if (btn) btn.textContent = "Show questions";
    renderDoc();
    return;
  }
  if (t.dataset.exDel != null) {
    state.exhibits.splice(Number(t.dataset.exDel), 1);
    render();
    return;
  }
  applyField(t);
  const structural = t.dataset.rerender || t.dataset.check || t.dataset.post;
  if (t.dataset.rerender) renderForm();
  else if (t.dataset.check) {
    const nextItem = checklist().find(function (it) { return !state.checks[it.id]; });
    document.querySelectorAll(".check-item").forEach(function (el) {
      el.classList.toggle("outlined", !!(nextItem && el.dataset.cid === nextItem.id));
    });
  }
  if (structural || t.dataset.a || t.dataset.ex != null || t.dataset.post) {
    renderDoc();
    renderStrip();
  }
}
async function onExhibitFiles(input) {
  const files = Array.prototype.slice.call(input.files || []);
  for (const file of files) {
    if (state.exhibits.length >= 8) break;
    if (!/^image\/(png|jpeg)$/.test(file.type)) continue;
    if (file.size > 4 * 1024 * 1024) continue;
    const dataUrl = await readFile(file);
    if (!/^data:image\/(png|jpeg);base64,/.test(dataUrl)) continue;
    state.exhibits.push({ name: file.name, caption: "", dataUrl: dataUrl });
  }
  input.value = "";
  render();
}
function readFile(file) {
  return new Promise(function (resolve, reject) {
    const r = new FileReader();
    r.onload = function () { resolve(String(r.result)); };
    r.onerror = function () { reject(r.error); };
    r.readAsDataURL(file);
  });
}
async function doExport(which) {
  const msg = document.getElementById("exportMsg");
  try {
    const docs = documents();
    if (!docs.length) return;
    if (which === "one") {
      const doc = docs.find(function (d) { return d.id === state.docTab; }) || docs[0];
      const blob = await exportDoc(doc);
      downloadBlob(blob, doc.filename);
    } else {
      const zip = new JSZip();
      for (const doc of docs) {
        const blob = await exportDoc(doc);
        zip.file(doc.filename, blob);
      }
      const blob = await zip.generateAsync({ type: "blob" });
      downloadBlob(blob, "All.zip");
    }
    if (msg) msg.textContent = "Download started.";
  } catch (e) {
    if (msg) msg.textContent = "Word export did not complete.";
  }
}

document.body.addEventListener("click", function (e) {
  const t = e.target.closest("button, label");
  if (!t) return;
  if (t.id === "btnCopy" || (t.closest && t.closest("#btnCopy"))) {
    const btn = document.getElementById("btnCopy");
    const done = function () { btn.textContent = "Copied"; setTimeout(function () { btn.textContent = "Copy mag room address"; }, 1200); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(MAG_ROOM).then(done).catch(function () { done(); });
    } else done();
    return;
  }
  if (t.id === "aiToggle") {
    const box = document.getElementById("aiExplain");
    if (!box) return;
    box.hidden = !box.hidden;
    if (!box.hidden) box.textContent = aiExplainHtml();
    return;
  }
  if (t.dataset && t.dataset.type) { selectType(t.dataset.type); return; }
  if (t.id === "btnTypes") {
    if (state.type) stash[state.type] = snapshot();
    state.type = null;
    render();
    return;
  }
  if (t.id === "btnNext") {
    const steps = stepsFor(state.type);
    if (state.step < steps.length - 1) state.step += 1;
    render();
    return;
  }
  if (t.id === "btnBack") {
    if (state.step > 0) state.step -= 1;
    render();
    return;
  }
  if (t.id === "btnSample") { loadSample(state.type || "place"); return; }
  if (t.id === "btnProfileSave") { saveProfile(); return; }
  if (t.id === "btnProfileLoad") { readProfile(); render(); return; }
  if (t.id === "exportOne") { doExport("one"); return; }
  if (t.id === "exportAll") { doExport("all"); return; }
  if (t.id === "btnTheme") {
    document.body.classList.toggle("dark");
    t.textContent = document.body.classList.contains("dark") ? "Light theme" : "Dark theme";
    return;
  }
  if (t.id === "btnPane") {
    state.showDoc = !state.showDoc;
    document.body.classList.toggle("show-doc", state.showDoc);
    t.textContent = state.showDoc ? "Show questions" : "Show document";
    return;
  }
  if (t.id === "btnLookup" || t.id === "btnLearn") {
    document.getElementById("overlayBody").innerHTML = t.id === "btnLookup" ? lookupHtml() : learnHtml();
    document.getElementById("overlay").hidden = false;
    return;
  }
  if (t.id === "overlayClose") { document.getElementById("overlay").hidden = true; return; }
  if (t.dataset && t.dataset.step != null) {
    state.step = Number(t.dataset.step);
    render();
    return;
  }
  if (t.dataset && t.dataset.doc) {
    state.docTab = t.dataset.doc;
    renderDoc();
    return;
  }
  if (t.dataset && t.dataset.open) {
    state.docTab = t.dataset.open;
    state.showDoc = true;
    document.body.classList.add("show-doc");
    const paneBtn = document.getElementById("btnPane");
    if (paneBtn) paneBtn.textContent = "Show questions";
    renderDoc();
    return;
  }
  if (t.dataset && t.dataset.exDel != null) {
    state.exhibits.splice(Number(t.dataset.exDel), 1);
    render();
  }
});
document.body.addEventListener("change", function (e) { onFormEvent(e); });
document.body.addEventListener("input", function (e) {
